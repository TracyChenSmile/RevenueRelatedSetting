<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>營收分類管理系統 V18 (銷售項目版 - 詳細資訊)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Telerik / Kendo UI Theme Simulation */
        :root {
            --kendo-primary: #0058E9;
            --kendo-primary-hover: #004ccb;
            --kendo-bg: #F4F6F9;
            --kendo-text: #424242;
            --kendo-border: #dee2e6;
            --kendo-selected-bg: rgba(0, 88, 233, 0.1);
            --kendo-drop-target: #fff3cd;      
            --kendo-drop-forbidden: #ffebe6;   
        }

        body {
            font-family: "Noto Sans TC", sans-serif;
            background-color: var(--kendo-bg);
            color: var(--kendo-text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Components --- */
        .k-button {
            background-color: #f5f5f5;
            border: 1px solid #dcdcdc;
            color: #444;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .k-button:hover:not(:disabled) { background-color: #e8e8e8; }
        .k-button:disabled { opacity: 0.5; cursor: not-allowed; color: #aaa; background-color: #f9f9f9; }
        .k-button-primary {
            background-color: var(--kendo-primary);
            color: white;
            border-color: var(--kendo-primary);
        }
        .k-button-primary:hover:not(:disabled) { background-color: var(--kendo-primary-hover); }
        .k-button-flat { background: transparent; border: none; color: var(--kendo-primary); }
        .k-button-icon { padding: 4px; border: none; background: transparent; color: #666; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; transition: 0.2s; }
        .k-button-icon:hover:not(:disabled) { background-color: #e0e0e0; }
        .k-button-icon.text-red-500:hover:not(:disabled) { background-color: #ffebee; color: #d32f2f; }
        
        .k-grid {
            background: white;
            border: 1px solid var(--kendo-border);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }
        .k-grid-header { background-color: #fafafa; border-bottom: 1px solid var(--kendo-border); font-weight: 600; color: #666; font-size: 13px; }
        .k-grid-header th { padding: 10px 12px; text-align: left; white-space: nowrap; }
        .k-grid-body { overflow-y: auto; }
        .k-grid-body td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; vertical-align: middle; }
        .k-grid-row { cursor: pointer; transition: background-color 0.1s; }
        .k-grid-row:hover { background-color: #f5f7fa; }
        .k-grid-row.k-selected { background-color: var(--kendo-selected-bg); border-left: 3px solid var(--kendo-primary); }
        .k-grid-row.k-selected td { font-weight: 500; color: var(--kendo-primary); }

        /* TreeList Specific */
        .k-treelist-row { border-bottom: 1px solid #eee; transition: background-color 0.2s; }
        .k-treelist-row:hover { background-color: #f8f9fa; }
        
        /* Drop Target States */
        .k-treelist-row.drop-target { background-color: var(--kendo-drop-target) !important; border: 2px dashed #ffc107; }
        .k-treelist-row.drop-forbidden { 
            background-color: var(--kendo-drop-forbidden) !important; 
            border: 2px dashed #ff4d4f; 
            cursor: not-allowed !important;
        }
        
        .nav-tabs { background: white; border-bottom: 1px solid var(--kendo-border); padding: 0 20px; display: flex; gap: 20px; }
        .nav-item { padding: 15px 5px; font-size: 14px; font-weight: 500; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-item.active { color: var(--kendo-primary); border-bottom-color: var(--kendo-primary); }
        .nav-item-badge { background: #FFC000; color: #333; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; }

        .k-badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .k-badge-success { background-color: #eaf7e4; color: #37b400; }
        .k-badge-role { background-color: #e6f7ff; color: #0058E9; border: 1px solid #91d5ff; }
        .k-badge-pending { background: #ffc000; color: #333; font-weight: bold; }
        .k-badge-error { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; display: inline-flex; align-items: center; gap: 4px; font-size: 11px;}
        .k-badge-ok { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; display: inline-flex; align-items: center; gap: 4px; font-size: 11px;}

        /* Dialog / Window */
        .k-window-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .k-window { background: white; width: 500px; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; animation: slideIn 0.3s ease-out; }
        .k-window-titlebar { padding: 12px 16px; border-bottom: 1px solid var(--kendo-border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; background-color: #fafafa; border-radius: 6px 6px 0 0; }
        .k-window-content { padding: 20px; }

        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .k-form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #666; }
        .k-textbox, .k-dropdown { width: 100%; padding: 8px 10px; border: 1px solid var(--kendo-border); border-radius: 4px; font-size: 14px; outline: none; transition: border 0.2s; }
        .k-textbox:focus, .k-dropdown:focus { border-color: var(--kendo-primary); box-shadow: 0 0 0 2px rgba(0,88,233, 0.1); }
        
        /* Layouts */
        .split-container { display: flex; height: 100%; overflow: hidden; padding: 20px; gap: 20px; }
        .split-left { width: 40%; display: flex; flex-direction: column; }
        .split-right { width: 60%; display: flex; flex-direction: column; background: white; border: 1px solid var(--kendo-border); border-radius: 4px; }

        /* Draggable Items */
        .draggable-item {
            background: white; border: 1px solid #ddd; border-radius: 4px; padding: 8px 10px; margin-bottom: 6px;
            cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: transform 0.1s, box-shadow 0.1s;
        }
        .draggable-item:hover { transform: translateY(-1px); box-shadow: 0 3px 5px rgba(0,0,0,0.1); border-color: var(--kendo-primary); }
        .draggable-item:active { cursor: grabbing; }
        .draggable-item i.cursor-move { color: #aaa; margin-right: 6px; }

        .view-section { display: none; height: 100%; overflow: hidden; }
        .view-section.active { display: block; }
        
        /* Tree Actions */
        .action-btn { 
            width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; 
            color: #666; transition: all 0.2s;
        }
        .action-btn:hover { background-color: #e0e0e0; color: #333; }
        .action-btn.btn-add:hover { background-color: #e6f7ff; color: #0058E9; }
        .action-btn.btn-edit:hover { background-color: #fff7e6; color: #d46b08; }
        .action-btn.btn-del:hover { background-color: #fff1f0; color: #cf1322; }
        .action-btn.btn-unassign { color: #666; }
        .action-btn.btn-unassign:hover { background-color: #f3f4f6; color: #0058E9; }
        
        .tree-node-info { display: flex; align-items: center; gap: 8px; flex: 1; }
        .warning-text { font-size: 11px; color: #cf1322; background: #fff1f0; padding: 1px 4px; border-radius: 4px; margin-left: 5px; border: 1px solid #ffa39e; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white w-8 h-8 rounded flex items-center justify-center font-bold">R</div>
            <div>
                <h1 class="font-bold text-lg text-gray-700">營收分類管理系統 V18</h1>
                <div class="text-xs text-gray-400">半導體設備專用版 (詳細項目資訊)</div>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <!-- Mock Role Switcher -->
            <div class="flex items-center gap-2 bg-gray-100 px-3 py-1 rounded text-sm border border-gray-200">
                <i class="fa-solid fa-user-shield text-gray-500"></i>
                <span class="text-gray-600">模擬目前角色：</span>
                <select id="currentUserRole" class="bg-transparent font-bold outline-none text-blue-700" onchange="switchRole()">
                    <option value="Admin">Admin (管理員)</option>
                    <option value="Sales">Sales (業務單位)</option>
                    <option value="Finance">Finance (財務單位)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-tabs">
        <div class="nav-item active" onclick="switchTab('tab1', this)">1. 類型與階層設定</div>
        <div class="nav-item" onclick="switchTab('tab2', this)">
            2. 銷售項目歸屬管理 <span class="nav-item-badge" id="navBadge">0</span>
        </div>
    </div>

    <!-- View 1: 類型與階層設定 -->
    <div id="tab1" class="view-section active">
        <div class="split-container">
            <!-- Left: Revenue Type Grid -->
            <div class="split-left">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-gray-700"><i class="fa-solid fa-list-ul mr-2"></i>營收類型定義</h2>
                    <button class="k-button k-button-primary text-sm" id="btnAddType" onclick="openTypeModal()"><i class="fa-solid fa-plus"></i> 新增類型</button>
                </div>
                <div class="k-grid flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="k-grid-header">
                            <tr>
                                <th>名稱</th>
                                <th>角色</th>
                                <th>Max層級</th>
                                <th>結構狀態</th>
                                <th class="w-20">操作</th>
                            </tr>
                        </thead>
                        <tbody id="typeGridBody" class="k-grid-body"></tbody>
                    </table>
                </div>
                <div class="text-xs text-gray-400 mt-2">* 僅負責角色可進行修改；若結構未達指定層級將顯示警告</div>
            </div>

            <!-- Right: Category Hierarchy TreeList -->
            <div class="split-right">
                <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800" id="hierarchyHeader">請選擇左側類型</h2>
                        <div class="text-xs text-gray-500" id="hierarchySubHeader"></div>
                    </div>
                    <button id="btnAddRootCat" class="k-button k-button-primary text-sm hidden" onclick="openAddCategoryModal(true)">
                        <i class="fa-solid fa-folder-plus"></i> 新增根類別
                    </button>
                </div>
                <div class="k-grid flex-1 relative" id="treeListContainer">
                    <div class="flex flex-col items-center justify-center h-full text-gray-400">
                        <i class="fa-regular fa-hand-point-left text-4xl mb-4"></i>
                        <p>請點擊左側列表以管理詳細階層</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- View 2: 銷售項目歸屬管理 (Enhanced Layout with Detail Info) -->
    <div id="tab2" class="view-section" style="padding:20px; height:100%;">
        <div class="h-full flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700"><i class="fa-solid fa-diagram-project mr-2"></i>銷售項目歸屬工作檯</h2>
                <div class="text-sm text-gray-500 bg-blue-50 px-3 py-1 rounded border border-blue-100">
                    <i class="fa-solid fa-circle-info text-blue-500 mr-1"></i> 
                    提示：將右側「未歸屬項目」拖曳至中間分類。若需換組，請點擊 <i class="fa-solid fa-arrow-right-from-bracket text-gray-400"></i> 移回待設定區。
                </div>
            </div>

            <div class="flex border border-gray-300 rounded bg-white overflow-hidden shadow-sm flex-1">
                <!-- Pane 1 (Left) - Always Visible -->
                <div class="w-1/4 border-r border-gray-200 bg-white flex flex-col transition-all duration-300">
                    <div class="p-3 border-b border-gray-200 bg-gray-50 font-bold text-gray-700">1. 選擇營收類型</div>
                    <div class="flex-1 overflow-y-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-100 text-xs text-gray-500">
                                <tr><th class="p-2">類型名稱</th><th class="p-2 text-center">已設定</th><th class="p-2 text-center">待設定</th></tr>
                            </thead>
                            <tbody id="assignTypeGridBody"></tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Pane 2 (Center - Drop Zone) - Resizable -->
                <div id="assignCenterPane" class="w-1/2 border-r border-gray-200 bg-white flex flex-col transition-all duration-300">
                    <div class="p-3 border-b border-gray-200 bg-gray-50 font-bold text-gray-700 flex justify-between items-center">
                        <span>2. 歸屬結構樹 (投放區)</span>
                        <span class="text-xs font-normal text-gray-400" id="assignCenterHint"></span>
                    </div>
                    
                    <!-- Search Bar (Searches both Categories AND Sales Items) -->
                    <div class="p-2 bg-white border-b border-gray-100">
                        <div class="relative">
                            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400"></i>
                            <input type="text" class="k-textbox pl-9" id="treeSearchInput" placeholder="搜尋專案、項目或描述..." onkeyup="filterTree(this.value)">
                        </div>
                    </div>

                    <div id="assignTreeContainer" class="flex-1 overflow-y-auto p-0 relative bg-gray-50/50">
                        <div class="flex items-center justify-center h-full text-gray-400"><p>請點擊左側類型以載入結構</p></div>
                    </div>
                </div>
                
                <!-- Pane 3 (Right - Draggable Source) - Auto Hide -->
                <div id="assignRightPane" class="w-1/4 bg-gray-50 flex flex-col transition-all duration-300">
                    <div class="p-3 border-b border-gray-200 bg-gray-100 font-bold text-gray-700 flex justify-between items-center">
                        <span>3. 待歸屬銷售項目</span>
                        <span class="bg-red-100 text-red-600 text-xs px-2 rounded-full" id="pane3Badge">0</span>
                    </div>
                    <div id="assignPendingList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (Same as V14) -->
    <div id="typeModal" class="k-window-overlay hidden">
        <div class="k-window" style="width: 500px;">
            <div class="k-window-titlebar">
                <span id="typeModalTitle">新增/編輯 類型</span>
                <button class="text-gray-400 hover:text-gray-600" onclick="closeTypeModal()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="k-window-content" style="padding: 20px;">
                <div class="space-y-4">
                    <input type="hidden" id="typeIdInput">
                    <div><label class="k-form-label">名稱</label><input type="text" class="k-textbox" id="typeNameInput"></div>
                    <div><label class="k-form-label">負責角色</label><select class="k-dropdown" id="typeRoleInput"><option value="Admin">Admin</option><option value="Sales">Sales</option><option value="Finance">Finance</option></select></div>
                    <div><label class="k-form-label">最大階層數</label><input type="number" class="k-textbox" id="typeDepthInput" value="3"></div>
                    <div><label class="k-form-label">描述</label><textarea class="k-textbox" id="typeDescInput"></textarea></div>
                    <div class="flex justify-end gap-2 pt-4">
                        <button class="k-button" onclick="closeTypeModal()">取消</button>
                        <button class="k-button k-button-primary" onclick="saveType()">儲存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addCategoryModal" class="k-window-overlay hidden">
        <div class="k-window" style="width: 500px;">
            <div class="k-window-titlebar">
                <span id="addCatTitle">新增類別</span>
                <button class="text-gray-400 hover:text-gray-600" onclick="closeAddCategoryModal()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="k-window-content" style="padding: 20px;">
                <div class="space-y-4">
                    <input type="hidden" id="addCatIsRoot">
                    <div class="bg-gray-50 p-3 rounded text-sm text-gray-600" id="addCatInfo"></div>
                    <div><label class="k-form-label">類別名稱</label><input type="text" class="k-textbox" id="addCatName"></div>
                    <div class="flex justify-end gap-2 pt-4">
                        <button class="k-button" onclick="closeAddCategoryModal()">取消</button>
                        <button class="k-button k-button-primary" onclick="confirmAddCategory()">確認新增</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // --- DOMAIN DATA (Semiconductor) ---
        let revenueTypes = [
            { id: 1, name: "公司財報分類", role: "Finance", maxDepth: 3, desc: "Financial Reporting" },
            { id: 2, name: "法說會分類", role: "Admin", maxDepth: 2, desc: "Investor Conference" },
            { id: 3, name: "業務分類", role: "Sales", maxDepth: 2, desc: "Business Unit View" }
        ];

        let categories = [
            // Type 1: 公司財報分類 (Max 3)
            { id: 101, typeId: 1, name: "銷售機台", parentId: null, level: 1, children: [
                { id: 1011, typeId: 1, name: "蝕刻機台", parentId: 101, level: 2, children: [
                    { id: 10111, typeId: 1, name: "高階蝕刻機", parentId: 1011, level: 3, children: []} // Complete
                ]},
                { id: 1012, typeId: 1, name: "自製機台", parentId: 101, level: 2, children: []} // Incomplete L2 (Needs L3)
            ]},
            { id: 102, typeId: 1, name: "服務收入", parentId: null, level: 1, children: []}, // Incomplete L1 (Needs L2, L3)
            { id: 103, typeId: 1, name: "其他", parentId: null, level: 1, children: []}, // Incomplete L1

            // Type 2: 法說會分類 (Max 2)
            { id: 201, typeId: 2, name: "銷售機台", parentId: null, level: 1, children: [
                { id: 2011, typeId: 2, name: "主力機型", parentId: 201, level: 2, children: []} // Complete
            ]},
            { id: 202, typeId: 2, name: "自製機台", parentId: null, level: 1, children: []}, // Incomplete L1
            { id: 203, typeId: 2, name: "服務", parentId: null, level: 1, children: []}, // Incomplete L1
            { id: 204, typeId: 2, name: "新產品", parentId: null, level: 1, children: []}, // Incomplete L1
            { id: 205, typeId: 2, name: "其他", parentId: null, level: 1, children: []}, // Incomplete L1

            // Type 3: 業務分類 (Max 2)
            { id: 301, typeId: 3, name: "銷售機台", parentId: null, level: 1, children: [
                { id: 3011, typeId: 3, name: "新客戶", parentId: 301, level: 2, children: []}
            ]},
            { id: 302, typeId: 3, name: "自製機台", parentId: null, level: 1, children: []},
            { id: 303, typeId: 3, name: "測試服務", parentId: null, level: 1, children: []},
            { id: 304, typeId: 3, name: "維修服務", parentId: null, level: 1, children: []},
            { id: 305, typeId: 3, name: "保養服務", parentId: null, level: 1, children: []},
            { id: 306, typeId: 3, name: "其他服務", parentId: null, level: 1, children: []}
        ];

        let salesItemMaster = [
            { id: "S001", projectName: "TSMC Fab12 P8 Expansion", name: "Etcher Tool Install #01", description: "Main Etching System installation for Phase 8", date: "2024-02-10" },
            { id: "S002", projectName: "UMC Fab12A Maintenance", name: "ESC Annual Contract 2024", description: "Annual Electrostatic Chuck maintenance service", date: "2024-02-12" },
            { id: "S003", projectName: "Micron A3 Retrofit", name: "Retrofit Project - Chamber A", description: "Upgrade existing chamber components for higher yield", date: "2024-02-15" },
            { id: "S004", projectName: "VIS Fab1 Upgrade", name: "Furnace Upgrade - Batch 2", description: "Software and hardware upgrade for Furnace tools", date: "2024-02-20" },
            { id: "S005", projectName: "PSMC P3 New Line", name: "Copper Plating Tool Setup", description: "Initial setup and calibration of Copper Plating unit", date: "2024-02-22" }
        ];

        let mappings = [
            { itemId: "S001", typeId: 1, categoryId: 10111 }, // Mapped to Type 1
            { itemId: "S002", typeId: 3, categoryId: 3011 }  // Mapped to Type 3
        ];

        // --- HELPER ---
        function switchTab(tabId, navEl) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            navEl.classList.add('active');
            
            if(tabId === 'tab1') renderTypeGrid();
            if(tabId === 'tab2') renderAssignmentWorkbench();
            updateTotalBadge();
        }

        function switchRole() {
            renderTypeGrid();
            if(selectedTypeId_Tab1) loadTreeList_Tab1(selectedTypeId_Tab1);
        }

        function updateTotalBadge() {
            let totalUnset = 0;
            revenueTypes.forEach(t => {
                const mappedCount = mappings.filter(m => m.typeId === t.id).length;
                totalUnset += (salesItemMaster.length - mappedCount);
            });
            const badge = document.getElementById('navBadge');
            if(badge) { badge.innerText = totalUnset; if(totalUnset===0) badge.classList.add('hidden'); else badge.classList.remove('hidden'); }
        }

        function countIncompleteBranches(typeId, maxDepth) {
            const typeCats = categories.filter(c => c.typeId === typeId && c.parentId === null);
            if(typeCats.length === 0) return 1; 
            let count = 0;
            function traverse(node) {
                const hasChildren = node.children && node.children.length > 0;
                if (!hasChildren) {
                    if (node.level < maxDepth) count++;
                } else {
                    node.children.forEach(traverse);
                }
            }
            typeCats.forEach(traverse);
            return count;
        }

        // --- TAB 1 (Definition) ---
        let selectedTypeId_Tab1 = null;
        function renderTypeGrid() {
            const tbody = document.getElementById('typeGridBody'); tbody.innerHTML = '';
            const currentUserRole = document.getElementById('currentUserRole').value;
            revenueTypes.forEach(t => {
                const isSelected = (t.id === selectedTypeId_Tab1) ? 'k-selected' : '';
                const canEdit = (t.role === currentUserRole);
                const actionButtons = canEdit ? `
                    <button class="k-button-icon" onclick="editType(event, ${t.id})" title="編輯"><i class="fa-solid fa-pen"></i></button>
                    <button class="k-button-icon text-red-500" onclick="deleteType(event, ${t.id})" title="刪除"><i class="fa-solid fa-trash"></i></button>
                ` : `<span class="text-gray-300 text-xs italic">無權限</span>`;
                const issues = countIncompleteBranches(t.id, t.maxDepth);
                const statusBadge = issues === 0 ? `<span class="k-badge-ok"><i class="fa-solid fa-check"></i> 完整</span>` : `<span class="k-badge-error"><i class="fa-solid fa-triangle-exclamation"></i> ${issues} 個分支未完成</span>`;
                tbody.innerHTML += `<tr class="k-grid-row ${isSelected}" onclick="selectTypeRow_Tab1(this, ${t.id})"><td>${t.name}</td><td><span class="k-badge k-badge-role">${t.role}</span></td><td>${t.maxDepth}</td><td>${statusBadge}</td><td>${actionButtons}</td></tr>`;
            });
        }
        function selectTypeRow_Tab1(tr, typeId) {
            document.querySelectorAll('#typeGridBody .k-grid-row').forEach(row => row.classList.remove('k-selected'));
            tr.classList.add('k-selected'); selectedTypeId_Tab1 = typeId; loadTreeList_Tab1(typeId);
        }
        // ... (CRUD Modals for Type) ...
        function openTypeModal(id=null) { 
            const role = document.getElementById('currentUserRole').value;
            if(!id && role !== 'Admin') { alert("模擬：僅 Admin 可新增類型"); return; }
            document.getElementById('typeModal').classList.remove('hidden'); 
            if(id) { const t=revenueTypes.find(x=>x.id===id); document.getElementById('typeIdInput').value=t.id; document.getElementById('typeNameInput').value=t.name; document.getElementById('typeRoleInput').value=t.role; document.getElementById('typeDepthInput').value=t.maxDepth; document.getElementById('typeDescInput').value=t.desc; } else { document.getElementById('typeIdInput').value=""; document.getElementById('typeNameInput').value=""; document.getElementById('typeRoleInput').value=role; document.getElementById('typeDepthInput').value=3; document.getElementById('typeDescInput').value=""; } 
        }
        function closeTypeModal() { document.getElementById('typeModal').classList.add('hidden'); }
        function saveType() { 
            const id=document.getElementById('typeIdInput').value; const name=document.getElementById('typeNameInput').value; const role=document.getElementById('typeRoleInput').value; const depth=parseInt(document.getElementById('typeDepthInput').value); const desc=document.getElementById('typeDescInput').value; if(!name)return;
            if(id){ const idx=revenueTypes.findIndex(x=>x.id==id); revenueTypes[idx]={...revenueTypes[idx],name,role,maxDepth:depth,desc}; } else { const newId=Math.max(...revenueTypes.map(x=>x.id),0)+1; revenueTypes.push({id:newId,name,role,maxDepth:depth,desc}); }
            closeTypeModal(); renderTypeGrid(); if(selectedTypeId_Tab1) loadTreeList_Tab1(selectedTypeId_Tab1);
        }
        function editType(e,id){ e.stopPropagation(); openTypeModal(id); }
        function deleteType(e,id){ e.stopPropagation(); if(confirm("確定刪除?")){ revenueTypes=revenueTypes.filter(x=>x.id!==id); renderTypeGrid(); document.getElementById('treeListContainer').innerHTML=''; } }

        // Tab 1 Right: TreeList
        let currentTypeMaxDepth_Tab1 = 0; let currentEditNode_Tab1 = null;
        function loadTreeList_Tab1(typeId) {
            const typeDef = revenueTypes.find(t => t.id === typeId); currentTypeMaxDepth_Tab1 = typeDef.maxDepth;
            const currentUserRole = document.getElementById('currentUserRole').value;
            const canEdit = (typeDef.role === currentUserRole);
            document.getElementById('hierarchyHeader').innerText = `類別階層 - ${typeDef.name}`;
            document.getElementById('hierarchySubHeader').innerText = `Max Depth: ${currentTypeMaxDepth_Tab1} | Owner: ${typeDef.role}`;
            const btnAddRoot = document.getElementById('btnAddRootCat');
            if(canEdit) btnAddRoot.classList.remove('hidden'); else btnAddRoot.classList.add('hidden');
            const typeCats = categories.filter(c => c.typeId === typeId && c.parentId === null);
            document.getElementById('treeListContainer').innerHTML = `<table class="w-full text-left border-collapse"><tbody class="k-grid-body">${renderTreeListRows_Tab1(typeCats, 0, canEdit)}</tbody></table>`;
        }
        function renderTreeListRows_Tab1(nodes, indent, canEdit) {
            let html = '';
            nodes.forEach(node => {
                const hasChildren = node.children && node.children.length > 0;
                const indentPx = indent * 24;
                const icon = hasChildren ? 'fa-caret-down' : 'fa-minus text-gray-300 text-xs';
                const folderIcon = hasChildren ? 'fa-folder text-yellow-500' : 'fa-file-lines text-gray-400';
                let warningHtml = '';
                if (!hasChildren && node.level < currentTypeMaxDepth_Tab1) {
                    warningHtml = `<span class="warning-text" title="未達定義層級"><i class="fa-solid fa-circle-exclamation"></i> 需建立子階 (L${node.level+1})</span>`;
                }
                let buttonsHtml = '';
                if (canEdit) {
                    const btnAdd = (node.level < currentTypeMaxDepth_Tab1) ? `<button class="action-btn btn-add" onclick="quickAddSub(event, ${node.id})" title="新增子階"><i class="fa-solid fa-plus"></i></button>` : `<span class="w-6 inline-block"></span>`;
                    const btnDel = (!hasChildren) ? `<button class="action-btn btn-del" onclick="deleteNodeById(event, ${node.id})" title="刪除"><i class="fa-solid fa-trash"></i></button>` : `<span class="w-6 inline-block"></span>`;
                    const btnEdit = `<button class="action-btn btn-edit" onclick="editCategory(event, ${node.id})" title="編輯"><i class="fa-solid fa-pen"></i></button>`;
                    buttonsHtml = `<div class="flex gap-1">${btnAdd}${btnEdit}${btnDel}</div>`;
                }
                html += `<tr class="k-treelist-row"><td style="padding-left: ${indentPx + 12}px"><span class="w-4 inline-block text-center mr-1 text-gray-400"><i class="fa-solid ${icon}"></i></span><i class="fa-regular ${folderIcon} mr-2"></i>${node.name} ${warningHtml}</td><td>L${node.level}</td><td>啟用</td><td>${buttonsHtml}</td></tr>`;
                if(hasChildren) html += renderTreeListRows_Tab1(node.children, indent + 1, canEdit);
            }); return html;
        }
        // ... (Category CRUD utils) ...
        function quickAddSub(e, id) { e.stopPropagation(); currentEditNode_Tab1 = findNodeRecursive(categories, id); openAddCategoryModal(false); }
        function editCategory(e, id) { e.stopPropagation(); const n=findNodeRecursive(categories, id); const v=prompt("修改名稱", n.name); if(v){n.name=v; loadTreeList_Tab1(selectedTypeId_Tab1);} }
        function deleteNodeById(e, id) { e.stopPropagation(); if(confirm("確定刪除?")){ deleteNodeRecursive(categories, id); loadTreeList_Tab1(selectedTypeId_Tab1); renderTypeGrid(); } }
        function openAddCategoryModal(isRoot) { document.getElementById('addCategoryModal').classList.remove('hidden'); document.getElementById('addCatIsRoot').value=isRoot; document.getElementById('addCatName').value=""; }
        function closeAddCategoryModal() { document.getElementById('addCategoryModal').classList.add('hidden'); }
        function confirmAddCategory() { 
            const isRoot = document.getElementById('addCatIsRoot').value === "true"; const name = document.getElementById('addCatName').value; if(!name)return;
            const newId = Date.now();
            if(isRoot) categories.push({id:newId, typeId:selectedTypeId_Tab1, name, parentId:null, level:1, children:[]});
            else { if(!currentEditNode_Tab1.children)currentEditNode_Tab1.children=[]; currentEditNode_Tab1.children.push({id:newId, typeId:currentEditNode_Tab1.typeId, name, parentId:currentEditNode_Tab1.id, level:currentEditNode_Tab1.level+1, children:[]}); }
            closeAddCategoryModal(); loadTreeList_Tab1(selectedTypeId_Tab1); renderTypeGrid(); 
        }
        function findNodeRecursive(nodes,id){ for(let node of nodes){ if(node.id===id)return node; if(node.children && node.children.length>0){let f=findNodeRecursive(node.children,id); if(f)return f;} } return null; }
        function deleteNodeRecursive(nodes,id){ for(let i=0;i<nodes.length;i++){ if(nodes[i].id===id){nodes.splice(i,1);return true;} if(nodes[i].children.length>0 && deleteNodeRecursive(nodes[i].children,id))return true; } return false; }

        // --- TAB 2: ASSIGNMENT WORKBENCH ---
        let selectedTypeId_Tab2 = null; let currentTypeMaxDepth_Tab2 = 0;
        
        function renderAssignmentWorkbench() { 
            renderAssignTypeGrid(); 
            if (selectedTypeId_Tab2) { 
                renderAssignTree(selectedTypeId_Tab2); 
                renderAssignPendingList(selectedTypeId_Tab2); 
            } 
        }
        
        function renderAssignTypeGrid() {
            const tbody = document.getElementById('assignTypeGridBody'); tbody.innerHTML = '';
            revenueTypes.forEach(t => {
                const mappedCount = mappings.filter(m => m.typeId === t.id).length;
                const pendingCount = salesItemMaster.length - mappedCount;
                const isSelected = (t.id === selectedTypeId_Tab2) ? 'bg-blue-50 border-l-4 border-blue-600' : 'hover:bg-gray-50 border-l-4 border-transparent cursor-pointer';
                const pendingBadge = pendingCount > 0 ? `<span class="k-badge k-badge-pending">${pendingCount}</span>` : `<span class="text-gray-300 text-xs">0</span>`;
                tbody.innerHTML += `<tr class="${isSelected} transition-all border-b border-gray-100" onclick="selectTypeRow_Tab2(${t.id}, ${t.maxDepth})"><td class="p-2 text-sm font-medium text-gray-700">${t.name}</td><td class="p-2 text-center text-xs text-gray-500">${mappedCount}</td><td class="p-2 text-center">${pendingBadge}</td></tr>`;
            });
        }
        function selectTypeRow_Tab2(typeId, maxDepth) { 
            selectedTypeId_Tab2 = typeId; 
            currentTypeMaxDepth_Tab2 = maxDepth; 
            document.getElementById('treeSearchInput').value = ''; 
            renderAssignmentWorkbench(); 
            document.getElementById('assignCenterHint').innerText = `Max Depth: ${maxDepth}`; 
        }
        
        // ** Filter Tree Logic **
        function filterTree(searchText) {
            const container = document.getElementById('assignTreeContainer');
            renderAssignTree(selectedTypeId_Tab2, searchText);
        }

        function renderAssignTree(typeId, searchText = "") {
            const container = document.getElementById('assignTreeContainer');
            const typeCats = categories.filter(c => c.typeId === typeId && c.parentId === null);
            if(typeCats.length === 0) { container.innerHTML = `<div class="flex items-center justify-center h-full text-gray-400">尚無分類結構</div>`; return; }
            let html = `<div class="p-2">`;
            typeCats.forEach(cat => { html += renderAssignTreeNodes(cat, 0, searchText); });
            html += `</div>`; container.innerHTML = html;
        }

        function renderAssignTreeNodes(node, indent, searchText) {
            // Enhanced Search: Check Category Name OR Mapped Item Name
            let matchSelf = node.name.toLowerCase().includes(searchText.toLowerCase());
            
            // Check mapped items for match
            const projs = mappings.filter(m => m.categoryId === node.id && m.typeId === selectedTypeId_Tab2);
            const matchProject = projs.some(m => {
                const p = salesItemMaster.find(x => x.id === m.itemId);
                return p && (p.name.toLowerCase().includes(searchText.toLowerCase()) || 
                             p.projectName.toLowerCase().includes(searchText.toLowerCase()) ||
                             p.description.toLowerCase().includes(searchText.toLowerCase()));
            });
            
            matchSelf = matchSelf || matchProject;

            let childrenHtml = '';
            let hasVisibleChildren = false;
            if (node.children && node.children.length > 0) {
                node.children.forEach(child => { 
                    const childResult = renderAssignTreeNodes(child, indent + 1, searchText);
                    if (childResult) {
                        childrenHtml += childResult;
                        hasVisibleChildren = true;
                    }
                });
            }

            if (searchText && !matchSelf && !hasVisibleChildren) return '';

            const indentPx = indent * 20; const hasChildren = node.children && node.children.length > 0;
            const icon = hasChildren ? 'fa-folder-open text-yellow-500' : 'fa-folder text-yellow-500';
            const isComplete = (node.level >= currentTypeMaxDepth_Tab2);
            const isForbidden = !isComplete || hasChildren; 
            
            const dropAttr = `ondragover="handleDragOver(event, this, ${isForbidden})"` + 
                             `ondragleave="handleDragLeave(event, this)"` +
                             `ondrop="handleDrop(event, ${node.id}, ${isForbidden})"`;
            
            let warnIcon = (!hasChildren && !isComplete) ? `<i class="fa-solid fa-ban text-red-500 ml-2" title="結構未完成 (禁止拖曳)"></i>` : '';
            let forbiddenClass = isForbidden ? 'cursor-not-allowed opacity-80' : '';

            let html = `
                <div class="mb-1">
                    <div class="flex items-center p-2 rounded hover:bg-white border border-transparent transition-colors ${forbiddenClass}" 
                         style="padding-left: ${indentPx + 8}px" ${dropAttr}
                         data-incomplete="${!isComplete}">
                        <i class="fa-solid ${icon} mr-2"></i>
                        <span class="text-sm font-bold text-gray-700 select-none">${node.name}</span>
                        <span class="ml-2 text-xs text-gray-400 bg-gray-100 px-1 rounded">L${node.level}</span>
                        ${warnIcon}
                    </div>
                    <div class="ml-4 border-l border-gray-200" style="padding-left: ${indentPx + 8}px">${renderMappedProjects(node.id, searchText)}</div>
            `;
            html += childrenHtml; 
            html += `</div>`;
            return html;
        }

        function renderMappedProjects(catId, searchText = "") {
            const projs = mappings.filter(m => m.categoryId === catId && m.typeId === selectedTypeId_Tab2);
            let html = '';
            projs.forEach(m => {
                const p = salesItemMaster.find(x => x.id === m.itemId);
                // Filter item if search text is present
                if(p && (searchText === "" || 
                         p.name.toLowerCase().includes(searchText.toLowerCase()) || 
                         p.projectName.toLowerCase().includes(searchText.toLowerCase()) || 
                         p.description.toLowerCase().includes(searchText.toLowerCase()))) { 
                    html += `
                        <div class="draggable-item flex items-center bg-blue-50 border-blue-200 text-blue-800 p-2 mb-1 rounded text-sm shadow-sm group">
                            <i class="fa-solid fa-grip-vertical text-blue-300 mr-2 cursor-move"></i>
                            <div class="flex-1 min-w-0">
                                <div class="text-xs text-gray-500 font-bold">${p.projectName}</div>
                                <div class="font-medium text-sm text-gray-800 truncate">${p.name}</div>
                                <div class="text-xs text-gray-400 truncate">${p.description}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button class="action-btn btn-unassign" onclick="unassignProject('${p.id}')" title="移至待設定清單 (解除歸屬)">
                                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                </button>
                                <i class="fa-solid fa-check-circle text-green-500"></i>
                            </div>
                        </div>`; 
                }
            }); return html;
        }

        // ** Unassign Logic **
        function unassignProject(itemId) {
            const idx = mappings.findIndex(m => m.typeId === selectedTypeId_Tab2 && m.itemId === itemId);
            if (idx >= 0) {
                mappings.splice(idx, 1);
                renderAssignmentWorkbench();
                updateTotalBadge();
            }
        }

        function renderAssignPendingList(typeId) {
            const container = document.getElementById('assignPendingList'); 
            const rightPane = document.getElementById('assignRightPane');
            const centerPane = document.getElementById('assignCenterPane');
            
            container.innerHTML = '';
            const mappedIds = mappings.filter(m => m.typeId === typeId).map(m => m.itemId);
            const pendingItems = salesItemMaster.filter(p => !mappedIds.includes(p.id));
            document.getElementById('pane3Badge').innerText = pendingItems.length;
            
            // Auto Layout: Hide Right Pane if empty
            if(pendingItems.length === 0) { 
                rightPane.classList.add('hidden');
                centerPane.classList.remove('w-1/2');
                centerPane.classList.add('w-3/4');
            } else {
                rightPane.classList.remove('hidden');
                centerPane.classList.remove('w-3/4');
                centerPane.classList.add('w-1/2');
            }

            if(pendingItems.length === 0) return;

            pendingItems.forEach(p => { container.innerHTML += `
                <div class="draggable-item" draggable="true" ondragstart="handleDragStart(event, '${p.id}', 'pending')">
                    <div class="flex items-start justify-between">
                         <div class="flex-1 min-w-0">
                            <div class="text-xs text-blue-600 font-bold mb-0.5">${p.projectName}</div>
                            <h3 class="font-bold text-gray-800 text-sm leading-tight">${p.name}</h3>
                            <div class="text-xs text-gray-500 mt-1 line-clamp-2" title="${p.description}">${p.description}</div>
                         </div>
                         <i class="fa-solid fa-grip text-gray-300 ml-2 mt-1"></i>
                    </div>
                    <div class="text-xs text-gray-400 mt-2 flex items-center gap-1 border-t pt-1 border-gray-100">
                        <i class="fa-regular fa-clock"></i> ${p.date}
                    </div>
                </div>`; 
            });
        }

        // --- DRAG & DROP ---
        let dragSrcProject = null;
        function handleDragStart(e, itemId, sourceType) { dragSrcProject = itemId; e.dataTransfer.effectAllowed = 'move'; }
        
        function handleDragOver(e, el, isForbidden) { 
            e.preventDefault(); 
            if(isForbidden) {
                e.dataTransfer.dropEffect = 'none';
                el.classList.add('drop-forbidden');
            } else {
                e.dataTransfer.dropEffect = 'move'; 
                el.classList.add('drop-target'); 
            }
        }
        
        function handleDragLeave(e, el) { 
            el.classList.remove('drop-target'); 
            el.classList.remove('drop-forbidden');
        }
        
        function handleDrop(e, targetCatId, isForbidden) {
            e.preventDefault(); 
            e.currentTarget.classList.remove('drop-target');
            e.currentTarget.classList.remove('drop-forbidden');
            
            if (isForbidden) {
                alert("禁止拖曳：此類別結構尚未完整 (需建立子階) 或非末端節點。");
                return;
            }

            if (!dragSrcProject) return;
            const oldIdx = mappings.findIndex(m => m.typeId === selectedTypeId_Tab2 && m.itemId === dragSrcProject);
            if (oldIdx >= 0) mappings.splice(oldIdx, 1);
            mappings.push({ itemId: dragSrcProject, typeId: selectedTypeId_Tab2, categoryId: targetCatId });
            renderAssignmentWorkbench(); updateTotalBadge(); dragSrcProject = null;
        }

        // Init
        renderTypeGrid();
        updateTotalBadge();
    </script>
</body>
</html>
